openapi: 3.1.0
info:
  title: Sigma API Gateway
  version: 0.1.0
  description: |
    API REST local que fala com a Sigma Reseller API oficial.
    Autentique com `Authorization: Bearer $SIGMA_SERVER_TOKEN`.
    O token do painel fica somente no servidor (`SIGMA_API_TOKEN`).
servers:
  - url: http://127.0.0.1:8787
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check publico
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.json:
    get:
      summary: Este contrato
      security: []
      responses:
        "200":
          description: OpenAPI JSON
  /v1/me:
    get:
      summary: Perfil da conta dona do token
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/customers:
    get:
      summary: Lista clientes
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: username, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: is_trial, in: query, schema: { type: string, enum: [YES, NO] } }
      responses:
        "200":
          description: Colecao paginada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      summary: Cria cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_id, package_id]
              properties:
                server_id: { type: string }
                package_id: { type: string }
                username: { type: string }
                password: { type: string }
                connections: { type: integer, minimum: 1, default: 1 }
                name: { type: string }
                email: { type: string }
                note: { type: string }
      responses:
        "201":
          description: Cliente criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
  /v1/customers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Mostra cliente
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Atualiza cliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
                name: { type: string }
                email: { type: string }
                note: { type: string }
      responses:
        "200":
          description: Cliente atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          $ref: "#/components/responses/Validation"
    delete:
      summary: Remove cliente
      responses:
        "200":
          description: Removido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/{id}/renew:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Renova cliente
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                package_id: { type: string }
                connections: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Renovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          $ref: "#/components/responses/Validation"
  /v1/customers/{id}/package:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Troca o pacote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [package_id]
              properties:
                package_id: { type: string }
      responses:
        "200":
          description: Pacote alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/customers/{id}/connections:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Troca as conexoes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connections]
              properties:
                connections: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Conexoes alteradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/customers/{id}/courtesy-days:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Adiciona dias de cortesia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, maximum: 365 }
      responses:
        "200":
          description: Dias adicionados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/customers/{id}/resync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Ressincroniza com o servidor de provisionamento
      responses:
        "200":
          description: Ressincronizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/customers/{id}/server-migration:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      summary: Migra de servidor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Migrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/packages:
    get:
      summary: Lista pacotes/planos
      responses:
        "200":
          description: Colecao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/servers:
    get:
      summary: Lista servidores
      responses:
        "200":
          description: Colecao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/reports/{kind}:
    get:
      summary: Relatorios oficiais
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [customers-count, resellers-count, membership, low-credits, new-resellers, expiring]
      responses:
        "200":
          description: Relatorio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/customers/by-username/{username}:
    get:
      summary: Busca exata por username
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/coupons:
    get:
      summary: Lista cupons
      responses:
        "200":
          description: Colecao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      summary: Cria cupom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "201":
          description: Cupom criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          $ref: "#/components/responses/Validation"
  /v1/coupons/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Mostra cupom
      responses:
        "200":
          description: Cupom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove cupom
      responses:
        "200":
          description: Removido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers:
    get:
      summary: Lista revendas downline
      responses:
        "200":
          description: Colecao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    post:
      summary: Cria revenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "201":
          description: Revenda criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "422":
          $ref: "#/components/responses/Validation"
  /v1/resellers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Mostra revenda
      responses:
        "200":
          description: Revenda
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      summary: Atualiza revenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Revenda atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/{id}/credits/add:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Adiciona creditos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Creditos adicionados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/{id}/credits/remove:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Remove creditos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Creditos removidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/{id}/credits/recharge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      summary: Recarrega creditos (auto-recarga da revenda)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Creditos recarregados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/me/dns:
    get:
      summary: Mostra o seu DNS
      responses:
        "200":
          description: DNS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    put:
      summary: Define ou limpa o seu DNS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: DNS alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/dns:
    get:
      summary: Lista DNS das revendas
      responses:
        "200":
          description: Colecao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/{id}/dns:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      summary: Mostra o DNS de uma revenda
      responses:
        "200":
          description: DNS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
    put:
      summary: Define ou limpa o DNS de uma revenda
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: DNS alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/dns/replace:
    post:
      summary: Substitui DNS em lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Lote aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/dns/apply:
    post:
      summary: Copia o seu DNS para as revendas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonObject"
      responses:
        "200":
          description: Aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/dns/history:
    get:
      summary: Historico de mudancas de DNS
      responses:
        "200":
          description: Historico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
  /v1/resellers/dns/history/{batch}/revert:
    parameters:
      - { name: batch, in: path, required: true, schema: { type: string } }
    post:
      summary: Reverte um lote de DNS
      responses:
        "200":
          description: Revertido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      properties:
        ok: { type: boolean }
        data:
          type: object
          properties:
            service: { type: string }
            version: { type: string }
            upstream: { type: string }
    Envelope:
      type: object
      properties:
        ok: { type: boolean }
        data: {}
    JsonObject:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        ok: { type: boolean }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthorized:
      description: Token local ausente/invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Nao encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: Validacao/estado invalido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Limite de 120 req/min do painel
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
