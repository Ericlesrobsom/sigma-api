services:
  sigma-api:
    image: ghcr.io/ericlesrobsom/sigma-api:0.1.1
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      SIGMA_PANEL_URL: ${SIGMA_PANEL_URL}
      SIGMA_USER: ${SIGMA_USER}
      SIGMA_PASS: ${SIGMA_PASS}
      SIGMA_SERVER_TOKEN: ${SIGMA_SERVER_TOKEN}
      SIGMA_BIND: 0.0.0.0:8787
      RUST_LOG: sigma_serve=info,tower_http=info
